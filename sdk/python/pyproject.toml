[project]
  name = "pulumi_incident"
  description = "A Pulumi package for managing incident.io resources."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "incident", "incident-io", "category/cloud"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "1.0.0a0+dev"
  [project.license]
    text = "MIT"
  [project.urls]
    Homepage = "https://incident.io"
    Repository = "https://github.com/incident-io/pulumi-incident"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_incident = ["py.typed", "pulumi-plugin.json"]
