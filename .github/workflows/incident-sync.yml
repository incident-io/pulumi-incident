name: sync

# Bumps the upstream Terraform provider to its latest release, regenerates the
# schema and SDKs, and cuts a release if anything changed. Runs daily; the job
# exits in seconds when upstream has not moved, so the cadence is cheap.
#
# The `incident-` prefix matters: ci-mgmt deletes every file in this directory
# that does not start with the provider name.
#
# It asks a question on a timer rather than reacting to an event, so a failed
# run changes nothing and the next run retries the same work.
on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bump, build and verify, but do not tag, release or publish"
        type: boolean
        default: false

permissions:
  contents: write # commit the bump, push the tag, create the release
  issues: write # report a failed run or a refused major bump

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a full SDK regeneration is slow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to work out the next version
          persist-credentials: true # the bump is pushed from this checkout

      # Same pin as the generated workflows. The `v2` tag adds only mise's
      # shims to PATH, which cannot resolve tools outside the repo, and tfgen
      # runs `pulumi convert` from /tmp.
      - uses: jdx/mise-action@c1a019b8d2586943b4dbebc456323b516910e310
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.3.7

      # Upstream's latest release, and what we currently pin. Both are read
      # rather than assumed so the job is a no-op whenever they already agree.
      - name: Check upstream
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest="$(gh release view \
            --repo incident-io/terraform-provider-incident \
            --json tagName --jq .tagName)"

          # The module path carries the major version, so the require line looks
          # like `.../terraform-provider-incident/v7 v7.0.0`.
          current="$(grep -oE 'terraform-provider-incident/v[0-9]+ v[0-9]+\.[0-9]+\.[0-9]+' provider/go.mod \
            | awk '{print $2}')"

          echo "upstream latest: ${latest}, we pin: ${current}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"

          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the latest upstream release; nothing to do."
            exit 0
          fi

          # Only move forwards. Without this, a yanked or re-tagged upstream
          # release reads as a bump and we would downgrade.
          newest="$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -1)"
          if [ "$newest" != "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::We pin ${current}, which is newer than upstream's latest ${latest}. Doing nothing."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A major upstream bump means upstream broke something, and it also moves
      # the Go module path, so the import in resources.go and
      # TFProviderModuleVersion both have to change. Neither is safe to do
      # unattended, so stop and ask for a human.
      - name: Refuse a major bump
        id: major
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          CURRENT: ${{ steps.upstream.outputs.current }}
        run: |
          set -euo pipefail
          latest_major="${LATEST%%.*}"   # v7.1.0 -> v7
          current_major="${CURRENT%%.*}"

          if [ "$latest_major" != "$current_major" ]; then
            gh issue create \
              --title "Upstream ${LATEST} is a major bump, needs a human" \
              --body "We pin ${CURRENT}. Moving to ${LATEST} changes the Go module
          path, so it needs \`provider/resources.go\` updated by hand:

          - the \`terraform-provider-incident/${current_major}/shim\` import
          - \`TFProviderModuleVersion\`

          Nothing was released. This run will keep failing until the bump is done
          or upstream ships a newer minor on ${current_major}.

          See CONTRIBUTING.md." || true
            echo "::error::Upstream ${LATEST} crosses a major version. Stopping."
            exit 1
          fi

      - name: Bump and regenerate
        if: steps.upstream.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail
          module="$(grep -oE 'terraform-provider-incident/v[0-9]+' provider/go.mod | head -1)"
          (cd provider && go get "github.com/incident-io/${module}@${LATEST}" && go mod tidy)
          make build

      # `make build` only proves it compiles and codegen ran. These three prove
      # the artefact we are about to publish actually works.
      - name: Verify
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          make lint_provider
          make test_provider

          # The plugin has to load and serve its schema over gRPC. A provider
          # that compiles but panics on startup fails here rather than in
          # someone's `pulumi up`.
          pulumi package get-schema ./bin/pulumi-resource-incident > /tmp/new-schema.json
          test -s /tmp/new-schema.json

          # Every resource and function the schema claims must be present and
          # carry an input set, which catches a regeneration that silently
          # dropped or emptied part of the provider.
          python3 - <<'EOF'
          import json, sys
          s = json.load(open("/tmp/new-schema.json"))
          res, fns = s.get("resources", {}), s.get("functions", {})
          if not res or not fns:
              sys.exit(f"schema is missing resources or functions: {len(res)}/{len(fns)}")
          empty = [t for t, r in res.items() if not r.get("inputProperties")]
          if empty:
              sys.exit(f"resources with no inputs: {empty}")
          print(f"schema ok: {len(res)} resources, {len(fns)} functions")
          EOF

      # Compare the regenerated schema against the last release. Upstream majors
      # are already refused above, so anything breaking reaching here is
      # unexpected and must not publish unattended.
      # Classify the schema change. schema-tools flags required-to-optional as
      # breaking, but relaxing a requirement cannot break a caller, so it is
      # judged by `kind` rather than by the `breaking` flag.
      - name: Check for breaking changes
        id: breaking
        if: steps.upstream.outputs.changed == 'true'
        env:
          # schema-tools reads GITHUB_TOKEN, not GH_TOKEN, and needs it to fetch
          # the previous schema.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          schema-tools compare \
            --provider incident \
            --repository github://api.github.com/incident-io \
            --old-commit master \
            --new-commit --local-path=provider/cmd/pulumi-resource-incident/schema.json \
            --json > /tmp/compare.json && rc=0 || rc=$?

          # A failed comparison is not the same as a clean one. A truncated
          # fetch or an HTML error page must stop the run rather than release as
          # if nothing changed.
          if [ "$rc" -ne 0 ] || ! python3 -c "import json,sys; json.load(open('/tmp/compare.json'))" 2>/dev/null; then
            echo "::error::schema-tools exited $rc without producing a comparison."
            cat /tmp/compare.json || true
            exit 1
          fi

          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys

          # Everything that can break a program that compiled against the last
          # release. required-to-optional is deliberately absent.
          BREAKING = {
              "missing-resource", "missing-function", "missing-input",
              "missing-property", "optional-to-required", "type-changed",
              "signature-changed", "token-remapped",
          }

          report = json.load(open("/tmp/compare.json"))
          kinds = sorted({c["kind"] for c in report.get("changes", [])})
          breaking = sorted(k for k in kinds if k in BREAKING)

          print("changes=" + ",".join(kinds))
          print("breaking=" + ",".join(breaking))
          print(f"is_breaking={'true' if breaking else 'false'}", file=sys.stderr)
          print("is_breaking=" + ("true" if breaking else "false"))
          EOF

          cat /tmp/compare.json | python3 -c "import json,sys; [print(' ', c['kind'], c['path']) for c in json.load(sys.stdin).get('changes',[])]"

      # Mirror upstream's bump type, unless the schema broke: a breaking change
      # is a major for us regardless of what upstream called it. Upstream majors
      # are refused earlier.
      - name: Decide next version
        id: version
        if: steps.upstream.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
          CURRENT: ${{ steps.upstream.outputs.current }}
          IS_BREAKING: ${{ steps.breaking.outputs.is_breaking }}
          BREAKING_KINDS: ${{ steps.breaking.outputs.breaking }}
        run: |
          set -euo pipefail
          base="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "::error::No existing tag. Cut the first release by hand so this job has a version to bump from."
            exit 1
          fi

          IFS=. read -r _ l_minor _ <<< "${LATEST#v}"
          IFS=. read -r _ c_minor _ <<< "${CURRENT#v}"
          IFS=. read -r b_major b_minor b_patch <<< "${base#v}"

          if [ "$IS_BREAKING" = "true" ]; then
            next="v$((b_major + 1)).0.0"
            echo "::notice::Breaking schema change (${BREAKING_KINDS}); releasing a major."
          elif [ "$l_minor" != "$c_minor" ]; then
            next="v${b_major}.$((b_minor + 1)).0"
          else
            next="v${b_major}.${b_minor}.$((b_patch + 1))"
          fi

          echo "next=${next}" >> "$GITHUB_OUTPUT"
          # Publishing tools take the version without the leading "v"; tags and
          # releases carry it.
          echo "next_bare=${next#v}" >> "$GITHUB_OUTPUT"
          echo "${base} -> ${next} (upstream ${CURRENT} -> ${LATEST}, breaking=${IS_BREAKING})"

      # Everything so far was built with the Makefile's default dev version, so
      # the SDK packages carry 1.0.0-alpha.0+dev. Rebuild with the real one
      # before anything is published. PROVIDER_VERSION must not carry the "v".
      - name: Rebuild at the release version
        if: steps.upstream.outputs.changed == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          make clean
          make build PROVIDER_VERSION="${NEXT#v}"

      # The same targets build_provider.yml calls, run in sequence rather than
      # across a matrix of runners. Slower, but it keeps one source of truth for
      # how a platform binary is built.
      - name: Build the platform binaries
        if: steps.upstream.outputs.changed == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
          SKIP_SIGNING: "true" # no Azure signing secrets in this repo
        run: |
          set -euo pipefail
          ver="${NEXT#v}"
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            echo "::group::$p"
            make "provider-$p" PROVIDER_VERSION="$ver"
            make "provider_dist-$p" PROVIDER_VERSION="$ver"
            echo "::endgroup::"
          done

          mkdir -p dist
          cp bin/*.tar.gz dist/
          (cd dist && shasum ./*.tar.gz > "pulumi-incident_${ver}_checksums.txt")

          # Six platforms plus the checksum file. A missing binary means a
          # silently skipped target, which must not reach a release.
          n=$(ls dist/*.tar.gz | wc -l | tr -d ' ')
          test "$n" -eq 6 || { echo "::error::expected 6 platform archives, got $n"; exit 1; }
          ls -la dist/

      - name: Stop here on a dry run
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          echo "### Dry run: built and verified ${NEXT}, published nothing" >> "$GITHUB_STEP_SUMMARY"

      # Tag before publishing. If a publish step then fails, the tag exists with
      # nothing released, and release.yml can be re-run on that tag by hand to
      # finish the job.
      - name: Commit and tag
        id: tag
        if: steps.upstream.outputs.changed == 'true' && !inputs.dry_run
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dist/ and build output are not part of the commit.
          git add --all -- ':!dist'
          if git diff --cached --quiet; then
            echo "::error::Upstream moved to ${LATEST} but regeneration changed nothing. Not tagging."
            exit 1
          fi
          git commit -m "Upgrade terraform-provider-incident to ${LATEST}"
          git tag "$NEXT"
          # --atomic: otherwise the tag can land while the branch push is
          # refused, and every later run recomputes this version and dies on a
          # tag that already exists.
          git push --atomic origin HEAD "refs/tags/$NEXT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The same action and the same sdk list publish.yml uses, so the packaging
      # rules stay in one place. The action only knows dotnet, java, nodejs and
      # python, so this publishes Node and Python; Go is handled below.
      - name: Publish the Node and Python SDKs
        if: steps.upstream.outputs.changed == 'true' && !inputs.dry_run
        uses: pulumi/pulumi-package-publisher@3ec1409d3e894142b9825c7859be8e57d362762a # v0.0.23
        with:
          sdk: all,!java,!dotnet
          version: ${{ steps.version.outputs.next_bare }}
        env:
          PYPI_USERNAME: __token__
          PYPI_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pushes a commit plus an `sdk/vX.Y.Z` tag, which is what the Go module
      # proxy resolves. base-ref is the commit we just pushed, not github.sha,
      # which still points at master as it was when this run started.
      - name: Publish the Go SDK
        if: steps.upstream.outputs.changed == 'true' && !inputs.dry_run
        uses: pulumi/publish-go-sdk-action@v1
        with:
          repository: ${{ github.repository }}
          base-ref: ${{ steps.tag.outputs.sha }}
          source: sdk
          path: sdk
          version: ${{ steps.version.outputs.next_bare }}
          additive: false
          files: |
            go.*
            go/**

      - name: Create the GitHub release
        if: steps.upstream.outputs.changed == 'true' && !inputs.dry_run
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          body: |
            Bridged from [terraform-provider-incident ${{ steps.upstream.outputs.latest }}](https://github.com/incident-io/terraform-provider-incident/releases/tag/${{ steps.upstream.outputs.latest }}).

            Schema changes: ${{ steps.breaking.outputs.changes || 'none' }}
          files: dist/*

      - name: Report failure
        if: failure() && steps.major.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Scheduled runs only email the workflow file's author, so the issue is
          # what actually reaches anyone.
          gh issue create \
            --title "Automated upstream sync failed" \
            --body "Nothing was released. The next scheduled run will retry.

          Run: $RUN_URL" || true
